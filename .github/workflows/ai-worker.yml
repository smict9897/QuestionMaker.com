name: AI Task Worker

on:
  schedule:
    # প্রতি ৫ মিনিট পর পর চলবে (UTC Time)
    - cron: '*/5 * * * *'
  workflow_dispatch: # চাইলে ম্যানুয়ালিও রান করা যাবে

jobs:
  run-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger AI Worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS -w "\nHTTP %{http_code}\n" -X GET "https://question-maker-com-g6ec.vercel.app/api/admin/ai-worker" -H "Authorization: Bearer $CRON_SECRET" --max-time 60

# ===== ফাইল শেষ =====
