name: AI Task Worker

on:
  # স্বয়ংক্রিয় schedule আপাতত বন্ধ। পুনরায় চালু করতে schedule ফিরিয়ে দিন।
  workflow_dispatch: # প্রয়োজন হলে শুধু ম্যানুয়ালি চালানো যাবে

jobs:
  run-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger AI Worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS -w "\nHTTP %{http_code}\n" -X GET "https://question-maker-com-g6ec.vercel.app/api/admin/ai-worker" -H "Authorization: Bearer $CRON_SECRET" --max-time 60

# ===== ফাইল শেষ =====
