name: Security regression checks
on:
  pull_request:
  push:
    branches: [main, arena/ef11ce66-questionmaker-com]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - name: Security tests (report failing TAP blocks)
        shell: bash
        run: |
          set +e
          npm run test:security > "$RUNNER_TEMP/security-tests.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/security-tests.log"
          if [ "$status" -ne 0 ]; then
            awk '/^not ok / { remaining=30 } remaining>0 { print "::error::" $0; remaining-- }' "$RUNNER_TEMP/security-tests.log"
          fi
          exit "$status"
